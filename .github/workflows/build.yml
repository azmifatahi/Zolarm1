name: Build Zolarm APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zolarm-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  GRADLE_VERSION: "8.7"
  JAVA_VERSION: "17"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Zolarm APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK + licenses
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for c in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" \
            "$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"; do
            [ -x "$c" ] && SDKMANAGER="$c" && break
          done
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          validate-wrappers: false

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type bin
          chmod +x ./gradlew

      - name: Verify keystore
        run: test -f keystore/zolarm-debug.jks && ls -la keystore/

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validate APK
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          DEST="app/build/outputs/apk/debug/Zolarm-debug.apk"
          test -f "$SRC"
          file "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -l "$SRC" | grep -q AndroidManifest.xml
          SIZE=$(stat -c%s "$SRC")
          echo "APK size=$SIZE"
          test "$SIZE" -gt 500000
          cp -f "$SRC" "$DEST"
          ls -lah "$DEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zolarm-debug-apk
          path: app/build/outputs/apk/debug/Zolarm-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zolarm-build-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore
          retention-days: 7
